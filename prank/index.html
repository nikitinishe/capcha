<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подтверждение безопасности</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .captcha-box {
    background: #fff;
    padding: 32px 28px;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .captcha-header { margin-bottom: 24px; }
  .logo { font-size: 40px; margin-bottom: 8px; }
  .captcha-header h1 { font-size: 20px; color: #202124; font-weight: 600; }

  .captcha-widget {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid #d3d3d3;
    border-radius: 4px;
    padding: 12px 14px;
    background: #f9f9f9;
    margin-bottom: 16px;
  }

  .checkbox-wrap {
    display: flex;
    align-items: center;
    cursor: pointer;
    user-select: none;
    gap: 12px;
  }

  .checkbox-wrap input { display: none; }

  .custom-check {
    width: 24px;
    height: 24px;
    border: 2px solid #5f6368;
    border-radius: 2px;
    background: #fff;
    display: inline-block;
    position: relative;
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .checkbox-wrap input:checked + .custom-check {
    background: #1a73e8;
    border-color: #1a73e8;
  }

  .checkbox-wrap input:checked + .custom-check::after {
    content: '';
    position: absolute;
    left: 7px;
    top: 2px;
    width: 6px;
    height: 12px;
    border: solid #fff;
    border-width: 0 3px 3px 0;
    transform: rotate(45deg);
  }

  .label-text { font-size: 15px; color: #202124; }
  .captcha-logo { font-size: 11px; color: #5f6368; text-align: right; line-height: 1.2; }
  .hint { font-size: 13px; color: #5f6368; margin-top: 8px; }

  .loader {
    width: 24px;
    height: 24px;
    border: 3px solid #e0e0e0;
    border-top-color: #1a73e8;
    border-radius: 50%;
    margin: 16px auto 0;
    display: none;
    animation: spin 0.8s linear infinite;
  }

  .loader.active { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* === Экран с картинкой === */
  #prankScreen {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    cursor: none;
    overflow: hidden;
  }

  #prankScreen.active { display: flex; }

  #prankImg {
    max-width: 100%;
    max-height: 100%;
    width: 100%;
    height: 100%;
    object-fit: contain;
    animation: shake 0.15s infinite;
  }

  @keyframes shake {
    0%   { transform: translate(0,0) scale(1.02); }
    25%  { transform: translate(-6px, 4px) scale(1.05); }
    50%  { transform: translate(5px, -5px) scale(1.03); }
    75%  { transform: translate(-4px, -3px) scale(1.06); }
    100% { transform: translate(0,0) scale(1.02); }
  }

  /* Мигание фона */
  #prankScreen.flash {
    animation: flashBg 0.25s infinite alternate;
  }

  @keyframes flashBg {
    from { background: #000; }
    to   { background: #ff0000; }
  }
</style>
</head>
<body>

  <div class="captcha-box">
    <div class="captcha-header">
      <div class="logo">🔒</div>
      <h1>Проверка безопасности</h1>
    </div>

    <div class="captcha-widget">
      <label class="checkbox-wrap">
        <input type="checkbox" id="captchaCheck">
        <span class="custom-check"></span>
        <span class="label-text">Я не робот</span>
      </label>
      <div class="captcha-logo">reCAPTCHA</div>
    </div>

    <p class="hint">Нажмите на галочку, чтобы продолжить</p>
    <div class="loader" id="loader"></div>
  </div>

  <!-- Экран пранка -->
  <div id="prankScreen">
    <img id="prankImg" src="meme.jpg" alt="">
  </div>

  <audio id="prankAudio" src="sound.mp3" preload="auto"></audio>

<script>
  const checkbox = document.getElementById('captchaCheck');
  const loader = document.getElementById('loader');
  const audio = document.getElementById('prankAudio');
  const prankScreen = document.getElementById('prankScreen');

  audio.volume = 1.0;
  let triggered = false;

  // Сколько раз повторить звук
  const REPEAT_COUNT = 3;

  checkbox.addEventListener('change', () => {
    if (!checkbox.checked || triggered) return;
    triggered = true;
    loader.classList.add('active');

    setTimeout(() => {
      startPrank();
    }, 700);
  });

  function startPrank() {
    // Показываем экран
    prankScreen.classList.add('active');

    // Пытаемся во фуллскрин
    if (prankScreen.requestFullscreen) {
      prankScreen.requestFullscreen().catch(() => {});
    } else if (prankScreen.webkitRequestFullscreen) {
      prankScreen.webkitRequestFullscreen();
    }

    // Вибрация (Android)
    if (navigator.vibrate) {
      navigator.vibrate([300, 100, 300, 100, 300, 100, 300]);
    }

    // Звук N раз
    playLoop(0);
  }

  function playLoop(i) {
    if (i >= REPEAT_COUNT) return;
    audio.currentTime = 0;
    const p = audio.play();
    if (p !== undefined) {
      p.catch(err => console.warn('play failed:', err));
    }
    audio.onended = () => playLoop(i + 1);
  }

  // Мигание фона через 1 сек после старта
  setTimeout(() => {
    // сработает только когда triggered == true и экран активен
  }, 0);

  // Запрет выхода
  window.addEventListener('beforeunload', (e) => {
    if (triggered) {
      e.preventDefault();
      e.returnValue = '';
    }
  });
</script>

<script type="module">
  import { inject } from 'https://cdn.jsdelivr.net/npm/@vercel/analytics@1/dist/index.js';
  inject();
</script>

</body>
</html>
